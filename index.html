<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="fontain242">
    <meta name="description"
        content="Recherchez un anime par titre ou par genre et découvrez ses épisodes, son classement et son synopsis.">
    <link rel="icon" type="image/png" href="favicon.png">
    <title>ANIME REQUESTER</title>
    <script>
        // Applique le thème avant le rendu pour éviter un flash blanc
        (function () {
            try {
                var t = localStorage.getItem("theme");
                if (t !== "light" && t !== "dark") {
                    t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
                }
                document.documentElement.setAttribute("data-theme", t);
            } catch (e) { }
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Public+Sans:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="CSS/style.css">
    <script src="JS/script.js" defer></script>
    <script src="JS/slideshow.js" defer></script>
</head>

<body>
    <header>
        <button type="button" id="theme-toggle" aria-label="Passer en mode sombre" title="Changer de thème">
            <span id="theme-icon" aria-hidden="true">☾</span>
            <span id="theme-label">Sombre</span>
        </button>
        <h1>ANIME REQUESTER</h1>
        <div class="api-configuration">
            <label for="api-key">Clé API :</label>
            <input type="password" id="api-key" placeholder="Saisissez votre clé API" autocomplete="off"
                spellcheck="false" aria-describedby="api-key-info">
        </div>
    </header>
    <main>
        <div class="bg-slideshow" aria-hidden="true">
            <div class="bg-track"></div>
        </div>
        <form id="formulaire" method="post">
            <label for="type_recherche">Type de recherche :</label>
            <select name="type_recherche" id="type_recherche">
                <option value="recherche_titre">Recherche par titre</option>
                <option value="recherche_genre">Recherche par genre</option>
            </select>
            <br>
            <label for="mot_cle">Mot clé :</label>
            <input type="text" name="mot_cle" id="mot_cle" placeholder="ex : One Piece">
            <fieldset id="filtres_genres" aria-describedby="aide_genres">
                <legend>Filtrer par genre</legend>
                <p id="aide_genres">Facultatif : cochez les genres à inclure dans la recherche.</p>
                <div class="liste-genres">
                    <label><input type="checkbox" name="genres" value="Action"> Action</label>
                    <label><input type="checkbox" name="genres" value="Adventure"> Aventure</label>
                    <label><input type="checkbox" name="genres" value="Comedy"> Comédie</label>
                    <label><input type="checkbox" name="genres" value="Drama"> Drame</label>
                    <label><input type="checkbox" name="genres" value="Fantasy"> Fantasy</label>
                    <label><input type="checkbox" name="genres" value="Horror"> Horreur</label>
                    <label><input type="checkbox" name="genres" value="Mystery"> Mystère</label>
                    <label><input type="checkbox" name="genres" value="Romance"> Romance</label>
                    <label><input type="checkbox" name="genres" value="Sci-Fi"> Science-fiction</label>
                    <label><input type="checkbox" name="genres" value="Slice of Life"> Tranche de vie</label>
                    <label><input type="checkbox" name="genres" value="Sports"> Sport</label>
                    <label><input type="checkbox" name="genres" value="Supernatural"> Surnaturel</label>
                    <label><input type="checkbox" name="genres" value="Suspense"> Suspense</label>
                </div>
            </fieldset>
            <button type="submit">Rechercher</button>
            <button type="reset">Effacer</button>
        </form>
        <div id="resultats" aria-live="polite"></div>


    </main>
    <footer>
        <p>Réalisé par <a href="https://github.com/LFtaine" target="_blank">Louis FONTAINE</a>, 
            <a href="https://github.com/GRENECHE-Matheo" target="_blank">Matheo GRENECHE</a>, 
            <a href="https://github.com/ArmPivt" target="_blank">Armand PIVERT</a> et 
            <a href="https://github.com/odilonhg" target="_blank">Dylan MESNAGE</a></p>
    </footer>
</body>

</html>
