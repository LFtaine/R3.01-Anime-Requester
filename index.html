<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="fontain242">
    <meta name="description" content="Recherchez un anime par titre ou par genre et découvrez ses épisodes, son classement et son synopsis.">
    <link rel="icon" type="image/png" href="favicon.png">
    <title>ANIME REQUESTER</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Public+Sans:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="CSS/style.css">
    <script src="JS/script.js" defer></script>
    <script src="JS/slideshow.js" defer></script>
</head>

<body>
    <header>
        <h1>ANIME REQUESTER</h1>
    </header>
    <main>
        <div class="bg-slideshow" aria-hidden="true">
            <div class="bg-track"></div>
        </div>
        <form id="formulaire" method="post">
            <label for="type_recherche">Type de recherche :</label>
            <select name="type_recherche" id="type_recherche">
                <option value="recherche_titre">Recherche par titre</option>
                <option value="recherche_genre">Recherche par genre</option>
            </select>
            <br>
            <label for="mot_cle">Mot clé :</label>
            <input type="text" name="mot_cle" id="mot_cle" placeholder="ex : One Piece">
            <button type="submit">Rechercher</button>
            <button type="reset">Effacer</button>
        </form>
        <div id="resultats" aria-live="polite"></div>


    </main>
    <footer>
        <p>Réalisé par Louis FONTAINE, Matheo GRENECHE, Armand PIVERT et Dylan MESNAGE</p>
    </footer>
</body>

</html>
