<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="author" content="fontain242">
        <link rel="icon" type="image/x-icon" href="favicon.png">
        <title>ANIME REQUESTER</title>
        <script src="JS/script.js" defer></script>
        <link rel="stylesheet" href="CSS/style.css">
    </head>
    <body>
        <!-- Diaporama de fond : chaque div = une image, dans l'ordre où elles doivent défiler.
             Pour ajouter une image : copie une ligne, change l'url(). 10 emplacements sont déjà prêts (voir style.css). -->
        <div class="bg-slideshow" aria-hidden="true">
            <div class="bg-slide" style="background-image: url('img/Kagurabachi1.png');"></div>
            <div class="bg-slide" style="background-image: url('img/Kagurabachi2.png');"></div>
            <div class="bg-slide" style="background-image: url('img/One_piece.png');"></div>
        </div>

        <header>
            <h1>ANIME REQUESTER</h1>
        </header>
        <main>
            <form id="formulaire"  method="post" >
                Type de recherche :
                <select name="type_recherche" id="type_recherche">
                    <option value="recherche_titre">Recherche par titre</option>
                    <option value="recherche_genre">Recherche par genre</option>
                </select>
                <br>
                Mot clé :
                <input type="text" name="mot_cle" id="mot_cle">
                <button type="submit">Rechercher</button>
                <button type="reset">Effacer</button>
            </form>
            <div id="resultats"></div>
            
            
        </main>
        <footer>
            <p>Réalisé par Louis Fontaine</p>
        </footer>
    </body>
</html>
